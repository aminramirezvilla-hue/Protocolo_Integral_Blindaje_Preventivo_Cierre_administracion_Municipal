name: Deploy CATU E-R stable + P5 preview

on:
  push:
    branches: ["dev/v0.1.4"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout P5 development branch
        uses: actions/checkout@v4
        with:
          ref: dev/v0.1.4
          path: devsrc

      - name: Assemble stable root and P5 preview
        run: |
          mkdir -p site/p5-preview
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            devsrc/ site/p5-preview/
          echo "P5 preview built from dev/v0.1.4" > site/p5-preview/PREVIEW_BUILD.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy:
    environment:
      name: p5-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy stable root + P5 preview
        id: deployment
        uses: actions/deploy-pages@v4
